<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小一數學綜合評估</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#243047;background:#f4f7fb}*{box-sizing:border-box}main{max-width:680px;margin:20px auto;padding:16px}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 5px 22px #25365715;margin-bottom:16px}h1{text-align:center;font-size:25px;margin:8px}p{line-height:1.7}.muted{color:#65748a;font-size:14px}.bar{height:9px;border-radius:9px;background:#e5eaf0;overflow:hidden}.bar>div{height:100%;background:#369c78;transition:width .2s}.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0}button{font:inherit;border:1px solid #d3dae4;background:#fff;border-radius:12px;padding:12px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}.nums button{padding:8px}.nums .active{border:2px solid #377ddd;background:#e9f1ff}.nums .done{background:#e4f6ed}.question{font-size:23px;font-weight:700;text-align:center;margin:22px 0;line-height:1.6}.visual{background:#f6f8fc;border-radius:15px;padding:16px;margin:12px 0;text-align:center}.objects{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;font-size:30px}.group{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;font-size:29px;padding:10px;border-bottom:1px solid #ddd}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choices button{font-size:23px;min-height:62px}.choices .selected{border:3px solid #3479c9;background:#e9f2ff}.answer{font-size:30px;font-weight:bold;min-height:55px;border:2px solid #c6d6ed;border-radius:12px;display:flex;align-items:center;justify-content:center;max-width:130px;margin:16px auto}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:320px;margin:0 auto}.keypad button{font-size:24px;padding:13px}.nav{display:flex;gap:12px;margin-top:20px}.nav button{flex:1}.primary{background:#3478c6;color:white;border-color:#3478c6}.speak{display:block;margin:8px auto;background:#edf4ff}.bond{position:relative;height:150px;max-width:280px;margin:auto}.bond:before,.bond:after{content:'';position:absolute;top:52px;width:85px;border-top:3px solid #778ba4}.bond:before{left:56px;transform:rotate(-35deg)}.bond:after{right:56px;transform:rotate(35deg)}.circle{position:absolute;border:2px solid #79a1ca;background:#e4f1ff;border-radius:12px;width:60px;height:48px;display:grid;place-items:center;font-size:25px;font-weight:bold;z-index:1}.circle.top{top:0;left:calc(50% - 30px)}.circle.left{bottom:0;left:22px}.circle.right{bottom:0;right:22px}.circle.missing{background:#fff2ce;border-color:#d6a12e}.shelfrow{font-size:36px;display:flex;justify-content:space-around;border-bottom:6px solid #a77c4d;padding:10px}.line{display:flex;justify-content:space-around;font-size:34px;gap:3px}.score{text-align:center;font-size:44px;font-weight:800;color:#277c5c}.result{padding:12px;border-bottom:1px solid #e5e8ee}.wrong{color:#b53333}.correct{color:#21835a}.hidden{display:none}@media(max-width:420px){main{padding:8px}.panel{padding:14px}.question{font-size:21px}.line{font-size:27px}}</style></head><body><main><section class="panel"><h1>小一數學綜合評估</h1><p class="muted" style="text-align:center">30題 · 圖像題 · 廣東話讀題 · 交卷後批改</p><div id="quiz"><div style="display:flex;justify-content:space-between"><strong id="number"></strong><span class="muted" id="progress"></span></div><div class="bar"><div id="fill"></div></div><div class="nums" id="nums"></div><p class="muted" id="topic"></p><div class="question" id="question"></div><button class="speak" id="speak">🔊 廣東話讀題</button><div class="visual" id="visual"></div><div id="response"></div><div class="nav"><button id="prev">上一題</button><button id="next" class="primary">下一題</button></div><p class="muted" style="text-align:center">作答期間不顯示對錯。讀題效果視乎裝置的廣東話語音支援。</p></div><div id="results" class="hidden"></div></section></main><script>
const Q=[
['分合','把11分成2和多少？','9','bond',[11,2,null]],['分合','4和9合起來是多少？','13','bond',[null,4,9]],['分合','把14分成兩個相同的數，每個是多少？','7','bond',[14,null,null]],['分合','6和8合起來是多少？','14','bond',[null,6,8]],['分合','把16分成9和多少？','7','bond',[16,9,null]],['分合','把18分成兩個相同的數，每個是多少？','9','bond',[18,null,null]],
['數數','數一數，圖中共有多少個蘋果？','12','objects',['🍎',12]],['數數','由15開始倒數：15、14、13、□、11。','12','plain'],['數數','以下哪一個是偶數？','8','choice',['5','7','8','9']],['數數','由小至大排列，哪一個數排第二？','9','choice',['12','4','9']],
['比較','數一數，哪一種水果比較多？','🍎','groups',[['🍎',8],['🍐',5]]],['比較','哪一組物件比較少？','✂️','groups',[['✏️',4],['✂️',3]]],['比較','哪一個數最大？','17','choice',['13','17','15','11']],['比較','哪一個數最小？','6','choice',['10','8','6','12']],['比較','有9條魚和6隻蝦。魚比蝦多多少？','3','compare',[['🐟',9],['🦐',6]]],
['位置','由左至右，哪一件物件在最右面？','🔊','row',['🏺','🖼️','🔊']],['位置','哪一件物件在花瓶和音箱之間？','🖼️','row',['🏺','🖼️','🔊']],['位置','小豬在士兵的哪一面？','上','shelf',['上','下']],['位置','小狗在最上面、最下面，還是中間？','最下面','shelf',['最上面','最下面','中間']],['位置','哪一隻動物在第二層的最左面？','🐧','animals',['🐧','🐶','🐺']],
['排隊','由左至右排隊，排在第3位的是誰？','👩','line',['👧','👦','👩','👨','👵','👴']],['排隊','由左至右排隊，戴帽子的人排第幾？','5','hatline',['👧','👦','👩','👨','👷','👴']],['排隊','由左至右排隊，老爺爺前面有多少人？','5','line',['👧','👦','👩','👨','👵','👴']],['排隊','由左至右排隊，媽媽後面有多少人？','3','line',['👧','👦','👩','👨','👵','👴']],['排隊','原本排第6位的小朋友，前面4人離開後，他排第幾？','2','plain'],
['加減','7 + 6 = □','13','plain'],['加減','□ + 8 = 15','7','plain'],['加減','17 − □ = 9','8','plain'],['加減','□ − 6 = 8','14','plain'],['加減','原本有12粒糖，吃了5粒，還剩多少粒？','7','objects',['🍬',12]]
];
let idx=0,answers=Array(30).fill('');const $=id=>document.getElementById(id);const numeric=new Set(['bond','objects','plain','compare','hatline']);function choices(q){if(q[3]==='groups')return q[4].map(x=>x[0]);if(q[3]==='row'||q[3]==='line'||q[3]==='shelf'||q[3]==='animals'||q[3]==='choice')return q[4];return null}function draw(){const q=Q[idx];$('number').textContent=`第 ${idx+1} / 30 題`;$('progress').textContent=`已作答 ${answers.filter(Boolean).length} 題`;$('fill').style.width=answers.filter(Boolean).length/30*100+'%';$('topic').textContent=q[0];$('question').textContent=q[1];$('nums').innerHTML=Q.map((_,i)=>`<button class="${i===idx?'active':answers[i]?'done':''}" data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('#nums button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;draw()});let v='';if(q[3]==='bond'){let a=q[4];v='<div class="bond">'+a.map((n,i)=>`<div class="circle ${['top','left','right'][i]} ${n===null?'missing':''}">${n===null?'?':n}</div>`).join('')+'</div>'}else if(q[3]==='objects'){v=`<div class="objects">${q[4][0].repeat(q[4][1])}</div>`}else if(q[3]==='groups'||q[3]==='compare'){v=q[4].map(g=>`<div class="group">${g[0].repeat(g[1])}</div>`).join('')}else if(q[3]==='row'){v=`<div class="line">${q[4].join(' ')}</div>`}else if(q[3]==='line'||q[3]==='hatline'){v='<div class="muted">左 → 右</div><div class="line">'+q[4].join(' ')+'</div>'}else if(q[3]==='shelf'){v=['🐷','💂','🐕'].map(x=>`<div class="shelfrow">${x}</div>`).join('')}else if(q[3]==='animals'){v=[['🐱','🐵','🐷'],['🐧','🐶','🐺'],['🐑','🐘','🐰']].map(a=>`<div class="shelfrow">${a.join('　')}</div>`).join('')}else if(q[3]==='choice'){v='<div class="muted">請選出正確答案</div>'}else{v='<span class="muted">請在下方輸入答案</span>'}$('visual').innerHTML=v;let opts=choices(q);if(opts){$('response').innerHTML='<div class="choices">'+opts.map(x=>`<button data-v="${x}" class="${answers[idx]===x?'selected':''}">${x}</button>`).join('')+'</div>';document.querySelectorAll('#response button').forEach(b=>b.onclick=()=>{answers[idx]=b.dataset.v;draw()})}else{$('response').innerHTML=`<div class="answer">${answers[idx]||'__'}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','清除','0','⌫'].map(x=>`<button data-k="${x}">${x}</button>`).join('')}</div>`;document.querySelectorAll('#response button').forEach(b=>b.onclick=()=>{let k=b.dataset.k;answers[idx]=k==='清除'?'':k==='⌫'?answers[idx].slice(0,-1):(answers[idx]+k).slice(0,2);draw()})}$('prev').disabled=idx===0;$('next').textContent=idx===29?'交卷':'下一題';$('next').disabled=idx===29&&answers.some(x=>!x)}$('prev').onclick=()=>{idx--;draw()};$('next').onclick=()=>{if(idx<29){idx++;draw()}else if(confirm('確定交卷？交卷後會顯示全部答案。'))finish()};$('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('此裝置不支援語音讀題。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(Q[idx][1].replaceAll('□','空格'));u.lang='zh-HK';u.rate=.85;const vs=speechSynthesis.getVoices();const hk=vs.find(v=>v.lang.toLowerCase()==='zh-hk');if(hk)u.voice=hk;else{alert('此裝置未偵測到廣東話語音，可能以其他中文語音朗讀。')}speechSynthesis.speak(u)};function finish(){speechSynthesis?.cancel();$('quiz').classList.add('hidden');$('results').classList.remove('hidden');const score=Q.filter((q,i)=>answers[i]===q[2]).length;let topics=[...new Set(Q.map(q=>q[0]))];$('results').innerHTML=`<h2 style="text-align:center">測驗完成</h2><div class="score">${score} / 30</div><p style="text-align:center">得分：${Math.round(score/30*100)} 分</p><h3>各範疇成績</h3>`+topics.map(t=>`<p>${t}：${Q.filter((q,i)=>q[0]===t&&answers[i]===q[2]).length} / ${Q.filter(q=>q[0]===t).length}</p>`).join('')+'<h3>逐題批改</h3>'+Q.map((q,i)=>`<div class="result"><strong>${i+1}. ${q[1]}</strong><div class="${answers[i]===q[2]?'correct':'wrong'}">${answers[i]===q[2]?'✓ 正確':'✗ 作答：'+answers[i]+'；正確答案：'+q[2]}</div></div>`).join('')+'<button class="primary" style="width:100%;margin-top:16px" onclick="location.reload()">重新測驗</button>'}draw();</script></body></html>
