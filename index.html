function showHome(){shown('home');const cats=[...new Set(META.map(m=>m.category))];$('categories').innerHTML=cats.map((c,i)=>{const m=META.find(x=>x.category===c);return `<button class="testcard" data-cat="${i}"><strong>${['🔢','🧩','➕','🧭','📚'][i]} ${c}</strong><span class="muted">${m.english}</span><span class="muted">${i===4?'5 Quizzes · 20 or 30 Questions':'5 Quizzes · 15 Questions Each'}</span></button>`}).join('');$('tests').innerHTML='';$('selectedCategory').textContent='請先選擇練習類別';$('historyShortcut').onclick=showHistory;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const c=cats[+b.dataset.cat];const m=META.find(x=>x.category===c);$('selectedCategory').textContent=c+' · '+m.english;$('tests').innerHTML=META.map((m,i)=>m.category===c?`<button class="testcard" data-set="${i}"><strong>📝 ${m.title}</strong><span class="muted">${m.enTitle} · ${SETS[i].length} Questions</span></button>`:'').join('');document.querySelectorAll('[data-set]').forEach(x=>x.onclick=()=>start(+x.dataset.set))})}
function start(i){set=i;idx=0;answers=Array(SETS[set].length).fill('');shown('quiz');draw()}
function drawVisual(q){const d=q.data;if(q.type==='bond'){return '<div class="bond">'+d.map((n,i)=>`<div class="circle ${['top','left','right'][i]} ${n===null?'missing':''}">${n===null?'?':n}</div>`).join('')+'</div>'}if(q.type==='objects')return `<div class="objects">${Array(d[1]).fill(`<span>${d[0]}</span>`).join('')}</div>`;if(q.type==='groups')return d.map(g=>`<div class="group">${Array(g[1]).fill(`<span>${g[0]}</span>`).join('')}</div>`).join('');if(q.type==='scene'){if(d.kind==='shelf')return `<div class="scene"><div class="shelf">${d.rows.map(row=>`<div class="shelfrow">${row.map(x=>`<span>${x}</span>`).join('')}</div>`).join('')}</div></div>`;return `<div class="scene"><div class="muted">${d.kind==='queue'?'隊首在左邊 → 隊尾在右邊':'由左至右觀察物件'}</div><div class="items">${d.items.map((x,i)=>`<div class="person"><span>${x}</span>${d.kind==='queue'?`<small>●</small>`:''}</div>`).join('')}</div><div class="floor"></div></div>`}return '<span class="muted">請選出或輸入正確答案。</span>'}
function draw(){const q=SETS[set][idx];$('difficultyNote').textContent=idx>=SETS[set].length-Math.ceil(SETS[set].length/4)?'⭐ 挑戰題':'🌱 基礎概念題';$('number').textContent=`${META[set].title} · 第${idx+1}題`;$('progressText').textContent=`已答${answers.filter(Boolean).length}/${SETS[set].length}`;$('fill').style.width=answers.filter(Boolean).length/SETS[set].length*100+'%';$('jump').innerHTML=answers.map((a,i)=>`<button data-i="${i}" class="${i===idx?'active':a?'done':''}">${i+1}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;draw()});$('topic').textContent=q.topic;$('question').textContent=q.text;$('visual').innerHTML=drawVisual(q);if(q.options){$('response').innerHTML='<div class="choices">'+q.options.map((o,i)=>`<button data-opt="${i}" class="${answers[idx]===o?'selected':''}">${o}</button>`).join('')+'</div>';document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{answers[idx]=q.options[+b.dataset.opt];draw()})}else{$('response').innerHTML=`<div class="answer">${answers[idx]||'__'}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','清除','0','⌫'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div>`;document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;answers[idx]=k==='清除'?'':k==='⌫'?answers[idx].slice(0,-1):(answers[idx]+k).slice(0,2);draw()})}$('prev').disabled=idx===0;$('next').textContent=idx===SETS[set].length-1?'交卷':'下一題';$('next').disabled=idx===SETS[set].length-1&&answers.some(a=>!a)}
$('prev').onclick=()=>{idx--;draw()};$('next').onclick=()=>{if(idx<SETS[set].length-1){idx++;draw()}else if(confirm('確定交卷？交卷後才會顯示答案。'))finish()};$('back').onclick=()=>{if(confirm('返回試卷列表會放棄本次答案，確定嗎？')){if('speechSynthesis'in window)speechSynthesis.cancel();showHome()}};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('此裝置不支援語音讀題。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SETS[set][idx].text.replaceAll('□','空格'));u.lang='zh-HK';u.rate=.83;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='zh-hk');if(voice)u.voice=voice;else alert('裝置未偵測到廣東話語音，可能以其他中文語音朗讀。');speechSynthesis.speak(u)};
const HISTORY_KEY='p1mathquiz_history_v1';
let currentReport=null;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getHistory(){try{const a=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function saveHistory(a){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(a.slice(0,120)));return true}catch{return false}}
function skillName(topic){if(['奇數與偶數','數列','比較','數數與比較'].includes(topic))return '數數、比較與數列';if(topic.includes('合成')||topic.includes('分解'))return '合成與分解';if(topic.includes('加法')||topic.includes('減法'))return '加減法';if(topic.includes('位置')||topic.includes('方向')||topic.includes('排隊'))return '位置、方向與排隊';return topic}
function makeReport(setNo,userAnswers){const qs=SETS[setNo];const entries=qs.map((q,i)=>({number:i+1,topic:q.topic,skill:q.skill||skillName(q.topic),text:q.text,type:q.type,data:q.data,answer:String(q.answer),given:String(userAnswers[i]||''),correct:String(userAnswers[i]||'')===String(q.answer)}));return {id:Date.now()+'-'+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),set:setNo,title:META[setNo].category+' · '+META[setNo].title,score:entries.filter(x=>x.correct).length,total:entries.length,entries}}
function skillsOf(r){const out={};for(const e of r.entries){const t=e.skill||skillName(e.topic);if(!out[t])out[t]={correct:0,total:0};out[t].total++;if(e.correct)out[t].correct++}return Object.entries(out).map(([name,v])=>({name,...v,rate:v.correct/v.total})).sort((a,b)=>a.rate-b.rate)}
function reportText(r){const skills=skillsOf(r),wrong=r.entries.filter(e=>!e.correct);return ['【小一數學學習報告】','試卷：'+r.title,'日期：'+new Date(r.date).toLocaleString('zh-HK'),'成績：'+r.score+'/'+r.total+'（'+Math.round(r.score/r.total*100)+'%）','','【各範疇表現】',...skills.map(s=>s.name+'：'+s.correct+'/'+s.total+'（'+Math.round(s.rate*100)+'%）'),'','【錯題詳情】',...(wrong.length?wrong.map(e=>'第'+e.number+'題（'+e.topic+'）：'+e.text+'\n作答：'+(e.given||'未作答')+'；正確：'+e.answer):['全部答對！']),'','【建議】',...(skills.filter(s=>s.rate<.8).map(s=>'優先重溫：'+s.name)||[])].join('\n')}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function copyReport(){if(!currentReport)return;const t=reportText(currentReport);try{await navigator.clipboard.writeText(t);alert('已複製學習報告，可以貼到 WhatsApp。')}catch{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('已嘗試複製報告。')}}
function saveReportText(){if(currentReport)downloadBlob(new Blob([reportText(currentReport)],{type:'text/plain;charset=utf-8'}),'數學學習報告.txt')}
function saveReportJSON(){if(currentReport)downloadBlob(new Blob([JSON.stringify(currentReport,null,2)],{type:'application/json;charset=utf-8'}),'數學測驗完整紀錄.json')}
function saveAllHistory(){downloadBlob(new Blob([JSON.stringify({format:'p1mathquiz-history-v1',records:getHistory()},null,2)],{type:'application/json;charset=utf-8'}),'數學測驗歷史備份.json')}
function saveReportImage(){if(!currentReport)return;const r=currentReport,skills=skillsOf(r),wrong=r.entries.filter(e=>!e.correct),canvas=document.createElement('canvas');canvas.width=1080;canvas.height=Math.max(800,480+skills.length*75+Math.min(wrong.length,30)*38);const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle='#213a54';c.font='bold 48px sans-serif';c.fillText('小一數學學習報告',60,90);c.font='27px sans-serif';c.fillText(r.title,60,145);c.fillText(new Date(r.date).toLocaleString('zh-HK'),60,190);c.fillStyle='#187b60';c.font='bold 72px sans-serif';c.fillText(r.score+' / '+r.total+'   ('+Math.round(r.score/r.total*100)+'%)',60,285);let y=365;c.fillStyle='#213a54';c.font='bold 31px sans-serif';c.fillText('各範疇表現',60,y);for(const s of skills){y+=70;c.fillStyle='#213a54';c.font='26px sans-serif';c.fillText(s.name,60,y);c.fillText(s.correct+'/'+s.total,880,y);c.fillStyle='#e8eef5';c.fillRect(60,y+12,950,12);c.fillStyle=s.rate<.8?'#c99237':'#3b9d82';c.fillRect(60,y+12,950*s.rate,12)}y+=85;c.fillStyle='#213a54';c.font='bold 31px sans-serif';c.fillText('錯題編號',60,y);c.font='26px sans-serif';if(!wrong.length){y+=40;c.fillText('全部答對！',60,y)}else for(const e of wrong){y+=38;c.fillText('第'+e.number+'題  '+e.topic+'   作答：'+(e.given||'未答')+'   正確：'+e.answer,60,y)}canvas.toBlob(b=>{if(b)downloadBlob(b,'數學學習報告.png');else alert('此瀏覽器未能產生圖片。')},'image/png')}
function reportButtons(){return `<div class="report-actions"><button class="primary" id="copyReport">📋 複製文字報告</button><button id="imageReport">🖼️ 儲存報告圖片</button><button id="txtReport">📄 下載文字報告</button><button id="jsonReport">💾 匯出完整錯題紀錄</button><button id="printReport">🖨️ 列印／儲存 PDF</button><button id="historyButton">📚 歷史成績</button></div>`}
function attachReportButtons(){ $('copyReport').onclick=copyReport;$('imageReport').onclick=saveReportImage;$('txtReport').onclick=saveReportText;$('jsonReport').onclick=saveReportJSON;$('printReport').onclick=()=>window.print();$('historyButton').onclick=showHistory;$('return').onclick=showHome}
function renderReport(r){currentReport=r;shown('results');const skills=skillsOf(r),wrong=r.entries.filter(e=>!e.correct),weak=skills.filter(s=>s.rate<.8);$('results').innerHTML=`<h2 class="center">測驗學習報告</h2><p class="muted center">${escapeHTML(r.title)} · ${new Date(r.date).toLocaleString('zh-HK')}</p><div class="score center">${r.score} / ${r.total}</div><p class="center">正確率 ${Math.round(r.score/r.total*100)}% · 答錯 ${wrong.length} 題</p><h3>各範疇表現</h3>${skills.map(s=>`<div class="skill"><div class="skill-head"><span>${escapeHTML(s.name)}</span><strong>${s.correct}/${s.total} · ${Math.round(s.rate*100)}%</strong></div><div class="skillbar"><div style="width:${s.rate*100}%;background:${s.rate<.8?'#c99237':'#3b9d82'}"></div></div></div>`).join('')}<div class="report-note"><strong>建議重溫</strong><p>${weak.length?weak.map(s=>escapeHTML(s.name)+'（'+s.correct+'/'+s.total+'）').join('、'):'各範疇表現良好，繼續練習！'}</p><p class="muted">分類成績只供參考；題數較少時，未必足以判斷真正強弱項。</p></div>${reportButtons()}<h3>逐題批改及錯題圖片</h3>${r.entries.map(e=>`<div class="result"><strong>第${e.number}題：${escapeHTML(e.text)}</strong><p class="muted">${escapeHTML(e.topic)}</p>${e.type==='scene'||e.type==='bond'||e.type==='objects'||e.type==='groups'?`<div class="visual report-visual">${drawVisual(e)}</div>`:''}<div class="${e.correct?'right':'wrong'}">${e.correct?'✓ 正確':'✗ 你的答案：'+escapeHTML(e.given||'未作答')+'；正確答案：'+escapeHTML(e.answer)}</div></div>`).join('')}<button class="primary no-print" style="width:100%;margin-top:18px" id="return">返回試卷列表</button>`;attachReportButtons()}
function finish(){if('speechSynthesis'in window)speechSynthesis.cancel();const r=makeReport(set,answers),a=getHistory();a.unshift(r);if(!saveHistory(a))alert('瀏覽器無法儲存歷史成績。請立即匯出完整紀錄作備份。');renderReport(r)}
function showHistory(){shown('history');const a=getHistory();$('history').innerHTML=`<h2>歷史成績</h2><p class="muted">紀錄只儲存在這部裝置的瀏覽器。清除瀏覽資料或使用私人瀏覽模式可能導致紀錄遺失。建議定期匯出備份。</p><div class="report-actions"><button id="backHome">← 返回試卷列表</button><button id="exportAll">💾 匯出所有歷史紀錄</button><button id="importAll">📥 匯入備份</button></div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><div>${a.length?a.map((r,i)=>`<div class="history-row"><div><strong>${escapeHTML(r.title)}</strong><div class="muted">${new Date(r.date).toLocaleString('zh-HK')} · ${r.score}/${r.total}</div></div><button data-record="${i}">查看報告</button></div>`).join(''):'暫時未有測驗紀錄。'}</div>`;$('backHome').onclick=showHome;$('exportAll').onclick=saveAllHistory;$('importAll').onclick=()=>$('importFile').click();$('importFile').onchange=importHistory;document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>renderReport(a[+b.dataset.record]))}
async function importHistory(e){const f=e.target.files?.[0];if(!f)return;try{if(f.size>3000000)throw Error('備份檔案過大');const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:Array.isArray(data.records)?data.records:[data];if(!incoming.length||!incoming.every(r=>r&&typeof r.id==='string'&&Array.isArray(r.entries)&&[15,20,30].includes(r.entries.length)&&typeof r.set==='number'&&r.set>=0&&r.set<META.length&&r.entries.every(e=>typeof e.text==='string'&&typeof e.answer==='string'&&typeof e.given==='string'&&typeof e.correct==='boolean')))throw Error('檔案格式不正確');const old=getHistory(),ids=new Set(old.map(r=>r.id));let added=0;for(const r of incoming){if(!ids.has(r.id)){old.push(r);ids.add(r.id);added++}}old.sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!saveHistory(old))throw Error('儲存空間不足');alert('成功匯入 '+added+' 份新紀錄。');showHistory()}catch(err){alert('無法匯入：'+err.message)}}
</script></body></html>
